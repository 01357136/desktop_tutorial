<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Basic DOM and function</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            width: 200px;
        }

        input, select, button {
            margin-bottom: 10px;
            padding: 5px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 120%;
            width: 200px;
        }

        button:hover {
            opacity: 0.8;
        }

        .result {
            font-size: 120%;     
            padding: 10px;
            border: 3px solid #ddd;
            width: 200px;
            text-align: center;
            box-sizing: border-box;
         }

	</style>
</head>

<body>
    <h3>Simple Calculator</h3>
    <div class="calculator">
        <input id = "input1" type = "number" placeholder = "input first number" required />
        <select id = 'operatorlist'>
            <option selected>+</option>
            <option>-</option>
            <option>*</option>
            <option>/</option>
        </select>
        <input id = "input2" type = "number" placeholder = "input second number" required />
        <button id = "displayButton">Calculate</button>
    </div>

    <div id = "results" class = "result">
        Results
    </div>

    <script>
        let inputnumber1;
        let inputnumber2;
        let operator;
        let Result;
        let number1;
        let number2;
        
        function start(){
            const button = document.getElementById("displayButton");
            button.addEventListener("click", calculate, false);
        }

        function calculate(){
            inputnumber1 = document.getElementById("input1").value;
            inputnumber2 = document.getElementById("input2").value;
            operator = document.getElementById("operatorlist").value;
            Result = document.getElementById("results");

            number1 = parseInt(inputnumber1);
            number2 = parseInt(inputnumber2);

            if(operator == "+"){
                Result.innerHTML = number1 + number2;
            }
            else if(operator == "-"){
                Result.innerHTML = number1 - number2;
            }
            else if(operator == "*"){
                Result.innerHTML = number1 * number2;
            }
            else{
                if(number2 === 0){
                    Result.innerHTML = "Dividing by 0 is illegal";
                }else{
                    Result.innerHTML = number1 / number2;
                }
            }

        }

        start();
    
        
    </script>

</body>

</html>
